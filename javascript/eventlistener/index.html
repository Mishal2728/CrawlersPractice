<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Listener</title>
  </head>
  <body>
    <button id="button">Parthiban</button>
    <button id="number">1</button>
    <script>
      const btn = document.getElementById("button");
      const numbtn = document.getElementById("number");

      btn.addEventListener("mouseover", (event) => {
        btn.textContent = "LEO das";
      });

      btn.addEventListener("click", (event) => {
        btn.textContent = "Leo";
      });

      btn.addEventListener("mouseout", (event) => {
        btn.textContent = "Na dhan da leo";
      });

      document.addEventListener("keyup", (event) => {
        switch (event.key) {
          case "ArrowUp":
            numbtn.textContent = Number(numbtn.textContent) + 1;
            break;
          case "ArrowDown":
            numbtn.textContent = Number(numbtn.textContent) - 1;
            break;
        }
      });
    </script>
  </body>
</html>
