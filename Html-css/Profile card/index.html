<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="profile-ctn">
            <div class="profile-head">
                <a href="/"><img src="images/menu.png" alt=""></a>
                <a href="/"><img src="images/setting.png" alt=""></a>
            </div>
            <div class="profile-body">
                <img src="images/profile-pic.png" class="profile-pic" alt="">
                <h2>Mishal ahamed</h2>
                <h3>AI Developer ai Crawlers Tech</h3>
                <div class="link">
                    <img src="images/instagram.png" alt="">
                    <img src="images/telegram.png" alt="">
                    <img src="images/dribble.png" alt="">
                </div>
            </div>
            <div class="footerctn">
                <button>Follow</button>
                <div class="profile-footer">

                    <p>Learn more about my profile</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
