<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Hub — Discover &amp; Stream</title>
    <meta name="description" content="Movie Hub — Search, discover, and explore trending movies with ratings, cast, and more." />
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css" rel="stylesheet">
</head>

<body>
    <!-- ---- HEADER ---- -->
    <div class="header">
        <div class="brand">
            <div class="logo">
                <img src="images/logo.png" alt="Movie Hub Logo" />
            </div>
            <h1 class="title">Movie Hub</h1>
        </div>

        <div class="search-box">
            <i class="ri-search-line search-icon"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search for movies..." autocomplete="off" />
        </div>

        <div class="filters">
            <select id="genreFilter" aria-label="Filter by genre">
                <option value="">All Genres</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Thriller">Thriller</option>
                <option value="Animation">Animation</option>
            </select>

            <select id="yearFilter" aria-label="Filter by year">
                <option value="">All Years</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
            </select>

            <select id="sortFilter" aria-label="Sort movies">
                <option value="">Sort by</option>
                <option value="rating">Highest Rated</option>
                <option value="release">Latest Release</option>
                <option value="alphabetical">A – Z</option>
            </select>

            <button class="clear-btn" id="clearBtn">
                <i class="ri-close-line"></i>
                <span>Clear All</span>
            </button>
        </div>
    </div>

    <!-- ---- MAIN CONTENT ---- -->
    <div class="main-content">
        <div id="trendingSection">
            <div class="section-title">🔥 Trending Now</div>
            <div class="carousal-container">
                <button class="carousal-btn previous" id="trendingPrevBtn" aria-label="Scroll left">
                    <i class="ri-arrow-left-wide-line"></i>
                </button>
                <div class="carosal" id="trendingCarousel">
                    <div class="loading"><i class="ri-loader-4-line spin"></i> Loading Trending Movies...</div>
                </div>
                <button class="carousal-btn next" id="trendingNxtBtn" aria-label="Scroll right">
                    <i class="ri-arrow-right-wide-line"></i>
                </button>
            </div>
        </div>

        <div class="section-title" id="randomSectionTitle">🎬 Discover</div>
        <div class="movies-grid" id="moviesGrid">
            <div class="loading"><i class="ri-loader-4-line spin"></i> Loading Movies...</div>
        </div>
    </div>

    <!-- ---- MODAL (injected by JS) ---- -->

    <script src="script.js"></script>
</body>

</html>
